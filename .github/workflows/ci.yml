name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typprüfung, Tests, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Lint (App)
        working-directory: apps/mobile
        run: npx expo lint
