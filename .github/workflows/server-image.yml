name: Server-Image

# Baut das Docker-Image des Servers und legt es in der GitHub Container Registry ab:
# ghcr.io/<besitzer>/zauberjournal-server (Tag „latest“ für main, Versionsnummer für v*-Tags).
on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/core/**
      - package-lock.json
      - .github/workflows/server-image.yml
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zauberjournal-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          # TrueNAS SCALE läuft auf x86_64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
