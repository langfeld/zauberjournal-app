name: Android-APK

# Baut eine signierte APK. Bei einem Tag wie „v0.3.0“ landet sie in einem GitHub-Release
# (für Obtainium), bei einem manuellen Start nur als Artefakt des Laufs.
#
# Benötigte Repository-Secrets (siehe docs/BETRIEB.md):
#   ANDROID_KEYSTORE_BASE64   – Signaturschlüssel (upload.p12), base64-kodiert
#   ANDROID_KEYSTORE_PASSWORD – Passwort dazu
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Secrets prüfen
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Die Secrets ANDROID_KEYSTORE_BASE64 und ANDROID_KEYSTORE_PASSWORD fehlen (siehe docs/BETRIEB.md)."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Version festlegen
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          # Fortlaufende Build-Nummer, damit Android jede neue APK als Update annimmt.
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Natives Android-Projekt erzeugen
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: APK bauen und signieren
        working-directory: apps/mobile/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=zauberjournal \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          rm "$RUNNER_TEMP/upload.p12"

      - name: APK benennen
        run: |
          name="zauberjournal-${APP_VERSION:-build-$GITHUB_RUN_NUMBER}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Release anlegen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK_NAME }}
