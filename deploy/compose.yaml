# Zauberjournal-Server auf TrueNAS
# Apps → Discover Apps → ⋮ → „Install via YAML“, dann diesen Inhalt einfügen.
# Anleitung: docs/BETRIEB.md

services:
  zauberjournal:
    image: ghcr.io/langfeld/zauberjournal-server:latest
    container_name: zauberjournal
    restart: unless-stopped
    # Der Container läuft als Benutzer 1000; das Dataset muss für ihn beschreibbar sein.
    # Alternativ hier den TrueNAS-Apps-Benutzer eintragen, z. B. user: "568:568".
    ports:
      - "3000:3000"
    volumes:
      - /mnt/POOL/apps/zauberjournal:/data # ← Pfad zum eigenen Dataset anpassen
    environment:
      - TZ=Europe/Berlin
      # KI-Import per Foto, Text und Links ohne Rezeptdaten; Schlüssel von https://app.requesty.ai
      - REQUESTY_API_KEY=
      # Optional: anderes Modell; ein leerer Fallback schaltet ihn ab.
      # - IMPORT_MODEL=anthropic/claude-sonnet-5-5
      # - IMPORT_FALLBACK_MODEL=google/gemini-3.6-flash
